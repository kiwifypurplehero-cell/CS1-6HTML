<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>CS1.6PLH</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #menu-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;
            padding: 28px 34px;
            overflow-y: auto;
            background: radial-gradient(circle, rgba(20, 25, 35, 0.92) 0%, rgba(10, 12, 18, 0.98) 100%);
        }

        .cs-title {
            margin-bottom: 14px;
            color: #de9b35;
            font-family: Impact, "Segoe UI", sans-serif;
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(222, 155, 53, 0.4), 2px 2px 4px #000;
        }

        .cs-main-nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            max-width: 270px;
        }

        .cs-menu-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 14px;
            border: 1px solid #57657a;
            border-left: 5px solid #de9b35;
            border-radius: 4px;
            background: linear-gradient(180deg, #3a4454 0%, #222933 100%);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            color: #e0e6ed;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            text-align: left;
            transition: 0.2s ease;
        }

        .cs-menu-btn:hover,
        .cs-menu-btn:focus-visible {
            border-color: #de9b35;
            background: linear-gradient(180deg, #4f5d73 0%, #2f3947 100%);
            box-shadow: 0 4px 15px rgba(222, 155, 53, 0.3);
            color: #fff;
            outline: none;
            transform: translateX(4px);
        }

        .cs-subpanel {
            display: none;
            flex-direction: column;
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            padding: 20px;
            overflow-y: auto;
            border: 1px solid #455366;
            border-radius: 8px;
            background: rgba(18, 22, 30, 0.95);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
        }

        .cs-subpanel h2 {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #344152;
            color: #de9b35;
            font-size: 22px;
        }

        .menu-section {
            width: 100%;
            margin-bottom: 12px;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.03);
        }

        .menu-section h3 {
            margin-bottom: 8px;
            color: #f1c40f;
            font-size: 15px;
        }

        .menu-section p {
            color: #d7dde6;
            font-size: 14px;
            line-height: 1.7;
        }

        .setting-label {
            margin: 10px 0 4px;
            color: #aaa;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .range-setting {
            width: 100%;
            accent-color: #de9b35;
        }

        .options-content {
            flex: 1;
            padding-right: 3px;
            overflow-y: auto;
        }

        .option-tab-page {
            display: none;
        }

        .option-tab-page.active {
            display: block;
            animation: tab-fade 0.16s ease-out;
        }

        .options-tabs {
            display: flex;
            gap: 2px;
            margin: 12px -20px 0;
            padding: 8px 10px;
            border-top: 1px solid #455366;
            background: #11161e;
        }

        .options-tab {
            flex: 1;
            padding: 7px 4px;
            border: 1px solid #455366;
            border-radius: 3px;
            background: #29313d;
            color: #cbd5e1;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
        }

        .options-tab.active,
        .options-tab:hover,
        .options-tab:focus-visible {
            border-color: #f2b857;
            background: #de9b35;
            color: #111;
            outline: none;
        }

        .btn-back-cs {
            align-self: flex-start;
            margin-top: 10px;
            padding: 10px 20px;
            border: 0;
            border-radius: 4px;
            background: #4a5568;
            color: #fff;
            cursor: pointer;
            font-weight: 700;
        }

        .btn-back-cs:hover,
        .btn-back-cs:focus-visible {
            background: #718096;
            outline: none;
        }

        @keyframes tab-fade {
            from { opacity: 0.45; transform: translateY(2px); }
            to { opacity: 1; transform: none; }
        }

        @media (max-width: 650px) {
            #menu-overlay { padding: 16px; }
            .options-tabs { flex-wrap: wrap; }
            .options-tab { min-width: 45%; }
        }
    </style>
</head>
<body>
    <main id="game-container">
        <section id="menu-overlay" aria-label="Menu principal">
            <h1 class="cs-title">CS1.6PLH</h1>

            <nav class="cs-main-nav" id="main-nav-panel" aria-label="Navegação principal">
                <button class="cs-menu-btn" type="button" data-open-panel="panel-multiplayer">
                    <span>🌐 MULTIPLAYER</span><span aria-hidden="true">›</span>
                </button>
                <button class="cs-menu-btn" type="button" data-open-panel="panel-options">
                    <span>⚙️ OPÇÕES</span><span aria-hidden="true">›</span>
                </button>
                <button class="cs-menu-btn" type="button" data-open-panel="panel-credits">
                    <span>⭐ CRÉDITOS</span><span aria-hidden="true">›</span>
                </button>
                <button class="cs-menu-btn" id="exit-button" type="button">
                    <span>🚪 SAIR DO JOGO</span><span aria-hidden="true">›</span>
                </button>
            </nav>

            <section class="cs-subpanel" id="panel-multiplayer" role="dialog" aria-labelledby="multiplayer-title">
                <h2 id="multiplayer-title">🌐 MULTIPLAYER</h2>
                <div class="menu-section">
                    <h3>CONEXÃO</h3>
                    <p>Recursos de rede e gerenciamento de salas permanecem indisponíveis nesta versão.</p>
                </div>
                <button class="btn-back-cs" type="button" data-close-panel>‹ VOLTAR</button>
            </section>

            <section class="cs-subpanel" id="panel-options" role="dialog" aria-labelledby="options-title">
                <h2 id="options-title">⚙️ OPÇÕES DO CS1.6PLH</h2>
                <div class="options-content">
                    <section class="option-tab-page active" data-option-page="audio">
                        <div class="menu-section">
                            <h3>🔊 ÁUDIO</h3>
                            <label class="setting-label" for="master-volume">VOLUME GERAL</label>
                            <input id="master-volume" class="range-setting" type="range" min="0" max="100" value="75">
                        </div>
                    </section>
                    <section class="option-tab-page" data-option-page="interface">
                        <div class="menu-section">
                            <h3>🖥️ INTERFACE</h3>
                            <p>A interface usa automaticamente o espaço disponível na tela.</p>
                        </div>
                    </section>
                </div>
                <footer class="options-tabs">
                    <button class="options-tab active" type="button" data-option-tab="audio">Áudio</button>
                    <button class="options-tab" type="button" data-option-tab="interface">Interface</button>
                </footer>
                <button class="btn-back-cs" type="button" data-close-panel>‹ VOLTAR</button>
            </section>

            <section class="cs-subpanel" id="panel-credits" role="dialog" aria-labelledby="credits-title">
                <h2 id="credits-title">⭐ CRÉDITOS</h2>
                <div class="menu-section">
                    <h3>CRIADO POR</h3>
                    <p><strong>Codex</strong><br><strong>Matheus (Plump)</strong></p>
                </div>
                <button class="btn-back-cs" type="button" data-close-panel>‹ VOLTAR</button>
            </section>
        </section>
    </main>

    <script>
        const mainNavigation = document.getElementById("main-nav-panel");
        const panels = [...document.querySelectorAll(".cs-subpanel")];

        function closeSubpanel() {
            panels.forEach((panel) => {
                panel.style.display = "none";
            });
            mainNavigation.style.display = "flex";
        }

        function openSubpanel(panelId) {
            closeSubpanel();
            mainNavigation.style.display = "none";
            document.getElementById(panelId).style.display = "flex";
        }

        function showOptionsTab(pageName, selectedButton) {
            document.querySelectorAll("[data-option-page]").forEach((page) => {
                page.classList.toggle("active", page.dataset.optionPage === pageName);
            });
            document.querySelectorAll("[data-option-tab]").forEach((button) => {
                button.classList.toggle("active", button === selectedButton);
            });
        }

        document.querySelectorAll("[data-open-panel]").forEach((button) => {
            button.addEventListener("click", () => openSubpanel(button.dataset.openPanel));
        });

        document.querySelectorAll("[data-close-panel]").forEach((button) => {
            button.addEventListener("click", closeSubpanel);
        });

        document.querySelectorAll("[data-option-tab]").forEach((button) => {
            button.addEventListener("click", () => showOptionsTab(button.dataset.optionTab, button));
        });

        document.getElementById("exit-button").addEventListener("click", () => {
            window.close();
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") closeSubpanel();
        });
    </script>
</body>
</html>
